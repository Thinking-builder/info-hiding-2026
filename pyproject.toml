[project]
name = "sfvmosaic"
version = "0.1.0"
description = "Reproduction of Lee and Tsai's secret-fragment-visible mosaic method"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sfvmosaic = "sfvmosaic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "scikit-image>=0.25.2",
]

